[project]
name = "alexandria"
version = "0.1.0"
description = "Minority Report: the MCP server, commission web surface, and deploy tooling that dispatch and grade Alexandria research. Split out of dhk/alexandria — see https://github.com/dhk/alexandria/issues/33."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "markdown-it-py>=3.0,<5.0",
  "mcp>=1.2,<2.0",  # 2.x dropped mcp.server.fastmcp; pin until this server migrates
  "platformdirs>=4.0",
  "pydantic>=2.8",
  "pypdf>=6.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "starlette>=0.46,<2.0",
  "uvicorn>=0.30",
]

[project.scripts]
alexandria-mcp = "alexandria.mcp_server:main"
alexandria-web = "alexandria.web:main"
alexandria-ctl = "alexandria.control:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["templates/"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["templates/"]
