[pack]
format_version = 1
name = "alexandria"
display_name = "Alexandria"
default_install_root = "~/src/alexandria"
# ALEXANDRIA_REPO names the research corpus (dhk/alexandria), which since the
# split is a different repository from this one. It is NOT the install root:
# pointing it there aims the server at the frozen copy of research/ captured
# inside the release, which serves silently stale data while reporting healthy.
# Set it once with --repo-path; the installer preserves it across upgrades.
repo_environment = "ALEXANDRIA_REPO"
repo_is_install_root = false
environment_file = "~/.config/alexandria/alexandria.env"
environment = { ALEXANDRIA_DATA_DIR = "~/.local/share/alexandria", ALEXANDRIA_SECRETS_FILE = "~/.config/alexandria/secrets.env" }
secrets_file = "~/.config/alexandria/secrets.env"
required_secrets = ["OPENROUTER_API_KEY"]
exclude = [
  ".git/**",
  ".scratch/**",
  ".venv/**",
  "dist/**",
  "data/**",
  "**/__pycache__/**",
  "*.egg-info/**",
]

[[services]]
unit = "alexandria-mcp.service"
description = "Alexandria MCP server (streamable HTTP)"
entrypoint = "alexandria-mcp"
args = ["--http", "--port", "8797", "--tunnel-path", "/alexandria"]
health_url = "http://127.0.0.1:8797/health"
health_service = "alexandria"

# The web surface, supervised like the MCP server rather than started by hand.
# It ran under nohup until #39: no restart on crash, dead after logout or a
# reboot, and silently killed by the very upgrade that replaced its venv.
#
# Port 8798 sits inside the registry's static range (8700-8799), so it can be
# declared and defended from collision. It listened on 8042 before, which is
# outside the range the registry allocates from and was recorded nowhere.
#
# No health check identity problem here: /health names itself (#39).
[[services]]
unit = "alexandria-web.service"
description = "Alexandria web surface (commission and published work)"
entrypoint = "alexandria-web"
args = ["--port", "8798"]
health_url = "http://127.0.0.1:8798/health"
health_service = "alexandria-web"

[capability]
token_file = "~/.local/share/alexandria/mcp-http-token"
urls = [
  "https://{tailscale_dns}/alexandria/mcp/{token}",
  "http://127.0.0.1:8797/mcp/{token}",
]

[tailscale]
mode = "funnel"
path = "/alexandria"
target = "http://127.0.0.1:8797"
port = 443
required = true

[registry]
helper_path = "/usr/local/bin/service-registry"
data_path = "/var/lib/common-services/registry.json"
static_range = [8700, 8799]
dynamic_range = [8800, 8999]
required = true

# This pack declares only its own service. Wingman used to be declared here
# too, because dhk/wingman had no way to declare itself — and this pack, which
# cannot observe wingman, described two per-user processes on 8787/8788 for
# weeks after wingman became one process on 8789 (#21). dhk/wingman#289 gave it
# its own registration, so that entry is gone from here (#23). The registry
# holds services this pack does not declare; the component check verifies only
# what is declared and does not require exclusivity.
# Declared so nothing else is handed 8798. No route entry: this surface is not
# on the funnel, deliberately -- it has no authentication and POST /dispatch
# spends real money.
[[registry.entries]]
service_id = "alexandria-web"
display_name = "Alexandria web"
owner = "dhk"
protocol = "tcp"
address = "127.0.0.1"
port = 8798
unit = "alexandria-web.service"
health_url = "http://127.0.0.1:8798/health"
health_service = "alexandria-web"
source = "dhk/minority-report"
adopt_listener = true

[[registry.entries]]
service_id = "alexandria"
display_name = "Alexandria"
owner = "dhk"
protocol = "tcp"
address = "127.0.0.1"
port = 8797
unit = "alexandria-mcp.service"
health_url = "http://127.0.0.1:8797/health"
health_service = "alexandria"
source = "dhk/minority-report"
adopt_listener = true
route_mode = "funnel"
route_host = "tailscale-self"
route_https_port = 443
route_paths = ["/alexandria"]
route_target = "http://127.0.0.1:8797"
