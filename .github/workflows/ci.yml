name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate (repository root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/validate.py

  mcp-server-template:
    name: validate (templates/mcp-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest
