[project]
name = "example-service"
version = "0.1.0"
description = "MCP server template: fork this for a new product's first-class MCP surface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.2,<2.0",  # 2.x dropped mcp.server.fastmcp; pin until this template migrates
  "platformdirs>=4.0",
  "pydantic>=2.8",
]

[project.scripts]
example-service-mcp = "example_service.mcp_server:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
